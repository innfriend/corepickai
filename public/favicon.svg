<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="corepick-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#corepick-grad)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="url(#chip-grad)" />

  <!-- CPU Pins / Traces (Top & Bottom) -->
  <g stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="22" y1="11" x2="22" y2="17" />
    <line x1="32" y1="11" x2="32" y2="17" />
    <line x1="42" y1="11" x2="42" y2="17" />

    <line x1="22" y1="47" x2="22" y2="53" />
    <line x1="32" y1="47" x2="32" y2="53" />
    <line x1="42" y1="47" x2="42" y2="53" />

    <!-- Left & Right Pins -->
    <line x1="11" y1="22" x2="17" y2="22" />
    <line x1="11" y1="32" x2="17" y2="32" />
    <line x1="11" y1="42" x2="17" y2="42" />

    <line x1="47" y1="22" x2="53" y2="22" />
    <line x1="47" y1="32" x2="53" y2="32" />
    <line x1="47" y1="42" x2="53" y2="42" />
  </g>

  <!-- Silicon Die Package -->
  <rect x="17" y="17" width="30" height="30" rx="6" fill="#09121F" stroke="#38BDF8" stroke-width="2" />

  <!-- Inner Accelerator Cores (4 Cores / Systolic Tensor Matrix) -->
  <rect x="21" y="21" width="9" height="9" rx="2" fill="#06B6D4" />
  <rect x="34" y="21" width="9" height="9" rx="2" fill="#3B82F6" />
  <rect x="21" y="34" width="9" height="9" rx="2" fill="#6366F1" />
  <rect x="34" y="34" width="9" height="9" rx="2" fill="#10B981" />

  <!-- Central Interconnect Node -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Live Pulse Status Indicator -->
  <circle cx="53" cy="11" r="5" fill="#10B981" />
  <circle cx="53" cy="11" r="7" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.75" />
</svg>
